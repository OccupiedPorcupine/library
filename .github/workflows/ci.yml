name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle budget (docs/performance.md)
        # Only the JS the shelf page loads up front counts; reader engines are lazy chunks.
        run: |
          files=$(grep -oE 'assets/[^"]+\.js' web/dist/index.html | sort -u | sed 's|^|web/dist/|')
          size=$(cat $files | gzip -c | wc -c)
          echo "Initial JS: $((size / 1024)) KB gzipped (budget 120 KB)"
          test "$size" -lt 122880
